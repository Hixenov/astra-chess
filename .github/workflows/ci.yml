name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: Self-test (perft, SEE, hashing, NNUE incremental updates, TT, search)
        run: ./astra --selftest
      - name: UCI protocol tests
        run: ./tests/uci_test.sh
      - name: Sanitizer build (ASan + UBSan)
        run: |
          make clean
          make CXXFLAGS="-std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-pthread -fsanitize=address,undefined"
          ./astra --selftest
